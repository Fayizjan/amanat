<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأمانات — نظام إدارة الودائع</title>

    <!-- خط عربي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- مكتبة طباعة PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* ===========================
           المتغيرات العامة
           =========================== */
        :root {
            --primary: #f37021;
            --primary-dark: #d95d15;
            --primary-light: #fff3ec;
            --secondary: #f5f5f5;
            --success: #22c55e;
            --success-light: #ecfdf5;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --white: #ffffff;
            --bg: #fafafa;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --radius: 12px;
            --radius-sm: 8px;
        }

        /* ===========================
           إعادة تعيين
           =========================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ===========================
           الهيدر
           =========================== */
        .app-header {
            background: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-icon { font-size: 26px; }

        .logo h1 {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* ===========================
           الأزرار
           =========================== */
        .btn {
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(243,112,33,0.3);
        }

        .btn-secondary { background: var(--secondary); color: var(--text); }
        .btn-secondary:hover { background: #e5e5e5; }

        .btn-success { background: var(--success); color: var(--white); }
        .btn-success:hover { background: #16a34a; }

        .btn-danger { background: var(--danger); color: var(--white); }
        .btn-danger:hover { background: #dc2626; }

        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 2px solid var(--border);
        }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        .btn-icon {
            padding: 8px 10px;
            font-size: 16px;
        }

        .btn-block { width: 100%; }

        /* ===========================
           شريط البحث
           =========================== */
        .search-box { margin: 20px 0 16px; }

        .search-box input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 16px;
            background: var(--white);
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* ===========================
           الإحصائيات
           =========================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--white);
            padding: 14px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary);
            direction: ltr;
        }

        .stat-card.usd .stat-value { color: var(--success); }

        /* ===========================
           قائمة العملاء
           =========================== */
        .customers-list {
            display: grid;
            gap: 12px;
        }

        .customer-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.2s;
            border-right: 4px solid var(--primary);
        }

        .customer-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .customer-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
            gap: 8px;
        }

        .customer-name {
            font-size: 17px;
            font-weight: 700;
        }

        .customer-phone {
            font-size: 13px;
            color: var(--text-light);
            direction: ltr;
            text-align: left;
            margin-top: 2px;
        }

        .customer-balances {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .balance-item {
            background: var(--primary-light);
            padding: 10px;
            border-radius: var(--radius-sm);
            text-align: center;
        }

        .balance-item.usd { background: var(--success-light); }

        .balance-label {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 2px;
        }

        .balance-amount {
            font-size: 17px;
            font-weight: 900;
            color: var(--primary);
            direction: ltr;
        }

        .balance-item.usd .balance-amount { color: var(--success); }

        /* ===========================
           الحالة الفارغة
           =========================== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-icon { font-size: 64px; margin-bottom: 16px; }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--text);
        }

        /* ===========================
           شاشة العميل
           =========================== */
        .view { display: none; }
        .view.active { display: block; }

        .back-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 16px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .customer-profile {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .customer-profile-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .customer-profile-name {
            font-size: 22px;
            font-weight: 900;
            color: var(--text);
        }

        .customer-profile-phone {
            font-size: 14px;
            color: var(--text-light);
            direction: ltr;
            margin-top: 4px;
        }

        .customer-profile-notes {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 8px;
            padding: 8px 12px;
            background: var(--secondary);
            border-radius: var(--radius-sm);
            border-right: 3px solid var(--primary);
        }

        .customer-balances-big {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .balance-big {
            padding: 18px;
            border-radius: var(--radius);
            text-align: center;
        }

        .balance-big.syp { background: var(--primary-light); }
        .balance-big.usd { background: var(--success-light); }

        .balance-big-label {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .balance-big-amount {
            font-size: 26px;
            font-weight: 900;
            direction: ltr;
        }

        .balance-big.syp .balance-big-amount { color: var(--primary); }
        .balance-big.usd .balance-big-amount { color: var(--success); }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 16px;
        }

        /* ===========================
           فلترة التاريخ
           =========================== */
        .filter-bar {
            background: var(--white);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-bar label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }

        .filter-bar input[type="date"] {
            padding: 8px 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 14px;
        }

        .filter-bar input[type="date"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* ===========================
           الحركات
           =========================== */
        .transactions-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .transactions-list {
            display: grid;
            gap: 10px;
        }

        .transaction {
            background: var(--white);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow);
            border-right: 4px solid;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .transaction.deposit { border-color: var(--success); }
        .transaction.withdraw { border-color: var(--danger); }

        .transaction-info { flex: 1; min-width: 0; }

        .transaction-type {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .transaction.deposit .transaction-type { color: var(--success); }
        .transaction.withdraw .transaction-type { color: var(--danger); }

        .transaction-meta {
            font-size: 13px;
            color: var(--text-light);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .transaction-notes {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 4px;
            font-style: italic;
        }

        .transaction-amount {
            font-size: 18px;
            font-weight: 900;
            direction: ltr;
            white-space: nowrap;
            text-align: left;
        }

        .transaction.deposit .transaction-amount { color: var(--success); }
        .transaction.withdraw .transaction-amount { color: var(--danger); }

        .transaction-delete {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 18px;
            padding: 4px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .transaction-delete:hover {
            background: var(--danger-light);
            color: var(--danger);
        }

        /* ===========================
           النوافذ المنبثقة
           =========================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal-overlay.show { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal {
            background: var(--white);
            border-radius: var(--radius);
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--white);
            z-index: 2;
        }

        .modal-header h2 { font-size: 18px; }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-light);
            line-height: 1;
            padding: 0 8px;
        }

        .modal-close:hover { color: var(--danger); }

        .modal-body { padding: 20px; }

        /* ===========================
           النماذج
           =========================== */
        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .required { color: var(--danger); }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 15px;
            transition: border-color 0.2s;
            background: var(--white);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        /* اختيار العملة */
        .currency-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .currency-option {
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--white);
        }

        .currency-option:hover { border-color: var(--primary); }

        .currency-option.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
        }

        .currency-option.selected.usd {
            border-color: var(--success);
            background: var(--success-light);
            color: var(--success);
        }

        .currency-option-icon { font-size: 22px; display: block; margin-bottom: 2px; }

        .currency-option-label { font-size: 14px; }

        /* نوع الحركة */
        .type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .type-option {
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--white);
            font-weight: 700;
            font-size: 14px;
        }

        .type-option.deposit.selected {
            border-color: var(--success);
            background: var(--success-light);
            color: var(--success);
        }

        .type-option.withdraw.selected {
            border-color: var(--danger);
            background: var(--danger-light);
            color: var(--danger);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions .btn { flex: 1; padding: 12px; }

        /* ===========================
           التنبيهات (Toast)
           =========================== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text);
            color: var(--white);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s;
            z-index: 2000;
            opacity: 0;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }

        /* ===========================
           الاستجابة للجوال
           =========================== */
        @media (max-width: 600px) {
            .logo h1 { font-size: 17px; }
            .logo-icon { font-size: 22px; }
            .btn { padding: 9px 12px; font-size: 13px; }
            .header-actions .btn span.label { display: none; }
            .stat-value { font-size: 17px; }
            .customer-name { font-size: 15px; }
            .balance-amount { font-size: 15px; }
            .customer-profile-name { font-size: 18px; }
            .balance-big-amount { font-size: 20px; }
            .action-buttons {
                grid-template-columns: 1fr;
            }
            .transaction-amount { font-size: 15px; }
        }
    </style>
</head>
</head>
<body>

    <!-- ===========================
         الهيدر
         =========================== -->
    <header class="app-header">
        <div class="container header-content">
            <div class="logo" onclick="App.goHome()">
                <span class="logo-icon">🏦</span>
                <h1>الأمانات</h1>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline btn-icon" id="btnBackup" title="نسخة احتياطية">💾</button>
                <button class="btn btn-outline btn-icon" id="btnRestore" title="استيراد نسخة">📂</button>
                <button class="btn btn-primary" id="btnAddCustomer">
                    <span>+</span> <span class="label">عميل جديد</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">

        <!-- ===========================
             شاشة العملاء (viewList)
             =========================== -->
        <section id="viewList" class="view active">

            <!-- البحث -->
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="🔍 ابحث عن عميل بالاسم أو الهاتف..."
                    autocomplete="off">
            </div>

            <!-- الإحصائيات -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">عدد العملاء</div>
                    <div class="stat-value" id="statCustomers">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">🍋 إجمالي الليرة</div>
                    <div class="stat-value" id="statSYP">0</div>
                </div>
                <div class="stat-card usd">
                    <div class="stat-label">💵 إجمالي الدولار</div>
                    <div class="stat-value" id="statUSD">0</div>
                </div>
            </div>

            <!-- قائمة العملاء -->
            <div class="customers-list" id="customersList"></div>

            <!-- حالة فارغة -->
            <div class="empty-state" id="emptyState" style="display:none;">
                <div class="empty-icon">📭</div>
                <h3 id="emptyTitle">لا يوجد عملاء بعد</h3>
                <p id="emptyDesc">ابدأ بإضافة أول عميل لك</p>
            </div>

        </section>

        <!-- ===========================
             شاشة العميل (viewCustomer)
             =========================== -->
        <section id="viewCustomer" class="view">

            <!-- شريط الرجوع -->
            <div class="back-bar">
                <button class="btn btn-secondary" onclick="App.goHome()">
                    ← رجوع للقائمة
                </button>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-outline btn-icon" id="btnEditCustomer" title="تعديل">✏️</button>
                    <button class="btn btn-outline btn-icon" id="btnDeleteCustomer" title="حذف">🗑️</button>
                </div>
            </div>

            <!-- بطاقة العميل -->
            <div class="customer-profile" id="printArea">
                <div class="customer-profile-header">
                    <div>
                        <div class="customer-profile-name" id="custName">—</div>
                        <div class="customer-profile-phone" id="custPhone"></div>
                        <div class="customer-profile-notes" id="custNotes" style="display:none;"></div>
                    </div>
                </div>

                <div class="customer-balances-big">
                    <div class="balance-big syp">
                        <div class="balance-big-label">🍋 رصيد الليرة السورية</div>
                        <div class="balance-big-amount" id="custBalSYP">0</div>
                    </div>
                    <div class="balance-big usd">
                        <div class="balance-big-label">💵 رصيد الدولار الأمريكي</div>
                        <div class="balance-big-amount" id="custBalUSD">0</div>
                    </div>
                </div>

                <!-- أزرار الحركات -->
                <div class="action-buttons no-print">
                    <button class="btn btn-success btn-block" id="btnDeposit">
                        💰 إيداع
                    </button>
                    <button class="btn btn-danger btn-block" id="btnWithdraw">
                        💸 سحب
                    </button>
                    <button class="btn btn-primary btn-block" id="btnPrint">
                        🖨️ طباعة PDF
                    </button>
                </div>
            </div>

            <!-- فلترة بالتاريخ -->
            <div class="filter-bar no-print">
                <label>من:</label>
                <input type="date" id="filterFrom">
                <label>إلى:</label>
                <input type="date" id="filterTo">
                <button class="btn btn-secondary" id="btnClearFilter">مسح</button>
            </div>

            <!-- الحركات -->
            <div class="transactions-title">
                <span>📋 سجل الحركات</span>
                <span id="txCount" style="font-size:13px; color:var(--text-light); font-weight:400;"></span>
            </div>

            <div class="transactions-list" id="transactionsList"></div>

            <div class="empty-state" id="emptyTx" style="display:none;">
                <div class="empty-icon">📄</div>
                <h3>لا توجد حركات</h3>
                <p>ابدأ بإضافة إيداع أو سحب</p>
            </div>

        </section>

    </main>

    <!-- ===========================
         نافذة عميل (إضافة/تعديل)
         =========================== -->
    <div class="modal-overlay" id="modalCustomer">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalCustomerTitle">إضافة عميل جديد</h2>
                <button class="modal-close" data-close="modalCustomer">×</button>
            </div>
            <div class="modal-body">
                <form id="formCustomer">
                    <input type="hidden" id="inputCustomerId">

                    <div class="form-group">
                        <label for="inputName">الاسم <span class="required">*</span></label>
                        <input type="text" id="inputName" required placeholder="مثال: أحمد محمد" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="inputPhone">الهاتف (اختياري)</label>
                        <input type="tel" id="inputPhone" placeholder="09xxxxxxxx" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="inputNotes">ملاحظات (اختياري)</label>
                        <textarea id="inputNotes" rows="3" placeholder="أي ملاحظات إضافية..."></textarea>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" data-close="modalCustomer">إلغاء</button>
                        <button type="submit" class="btn btn-primary">حفظ</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ===========================
         نافذة حركة (إيداع/سحب)
         =========================== -->
    <div class="modal-overlay" id="modalTransaction">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTxTitle">إضافة إيداع</h2>
                <button class="modal-close" data-close="modalTransaction">×</button>
            </div>
            <div class="modal-body">
                <form id="formTransaction">
                    <input type="hidden" id="inputTxType" value="deposit">

                    <!-- اختيار نوع الحركة (يظهر فقط إذا فتحناه عام) -->
                    <div class="type-selector" id="typeSelector" style="display:none;">
                        <div class="type-option deposit" data-type="deposit">💰 إيداع</div>
                        <div class="type-option withdraw" data-type="withdraw">💸 سحب</div>
                    </div>

                    <!-- اسم المودع (يظهر فقط عند الإيداع) -->
                    <div class="form-group" id="groupDepositor">
                        <label for="inputDepositor">اسم المودع <span class="required">*</span></label>
                        <input type="text" id="inputDepositor" placeholder="مثال: محمد علي" autocomplete="off">
                    </div>

                    <!-- اختيار العملة -->
                    <div class="form-group">
                        <label>العملة <span class="required">*</span></label>
                        <div class="currency-selector">
                            <div class="currency-option selected" data-currency="SYP">
                                <span class="currency-option-icon">🍋</span>
                                <span class="currency-option-label">ليرة سورية</span>
                            </div>
                            <div class="currency-option" data-currency="USD">
                                <span class="currency-option-icon">💵</span>
                                <span class="currency-option-label">دولار أمريكي</span>
                            </div>
                        </div>
                        <input type="hidden" id="inputCurrency" value="SYP">
                    </div>

                    <!-- المبلغ -->
                    <div class="form-group">
                        <label for="inputAmount">المبلغ <span class="required">*</span></label>
                        <input type="number" id="inputAmount" required min="0.01" step="0.01" placeholder="0" inputmode="decimal">
                    </div>

                    <!-- التاريخ -->
                    <div class="form-group">
                        <label for="inputDate">التاريخ</label>
                        <input type="date" id="inputDate">
                    </div>

                    <!-- ملاحظات -->
                    <div class="form-group">
                        <label for="inputTxNotes">ملاحظات (اختياري)</label>
                        <textarea id="inputTxNotes" rows="2" placeholder="..."></textarea>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" data-close="modalTransaction">إلغاء</button>
                        <button type="submit" class="btn btn-primary">حفظ</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ===========================
         حقل استيراد مخفي
         =========================== -->
    <input type="file" id="importFile" accept=".json" style="display:none;">

    <!-- ===========================
         التنبيهات
         =========================== -->
    <div class="toast" id="toast"></div>

</body>
</html>
<script>
/* =========================================================
   الأمانات — نظام إدارة الودائع
   الملف الكامل (SPA) — الجزء البرمجي
   ========================================================= */

const App = (() => {

    /* ===================================================
       1) طبقة البيانات (DB Layer)
       =================================================== */
    const DB = (() => {
        const KEYS = {
            CUSTOMERS: 'amanat_customers',
            TRANSACTIONS: 'amanat_transactions'
        };

        function _read(key) {
            try {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                console.error('خطأ قراءة:', e);
                return [];
            }
        }

        function _write(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify(data));
                return true;
            } catch (e) {
                console.error('خطأ حفظ:', e);
                return false;
            }
        }

        function _newId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        // ------- العملاء -------
        function getCustomers() { return _read(KEYS.CUSTOMERS); }

        function getCustomer(id) {
            return getCustomers().find(c => c.id === id) || null;
        }

        function addCustomer({ name, phone = '', notes = '' }) {
            const customers = getCustomers();
            const newCustomer = {
                id: _newId(),
                name: name.trim(),
                phone: phone.trim(),
                notes: notes.trim(),
                created_at: new Date().toISOString()
            };
            customers.push(newCustomer);
            _write(KEYS.CUSTOMERS, customers);
            return newCustomer;
        }

        function updateCustomer(id, updates) {
            const customers = getCustomers();
            const i = customers.findIndex(c => c.id === id);
            if (i === -1) return null;
            customers[i] = { ...customers[i], ...updates };
            _write(KEYS.CUSTOMERS, customers);
            return customers[i];
        }

        function deleteCustomer(id) {
            _write(KEYS.CUSTOMERS, getCustomers().filter(c => c.id !== id));
            _write(KEYS.TRANSACTIONS, getTransactions().filter(t => t.customer_id !== id));
            return true;
        }

        // ------- الحركات -------
        function getTransactions() { return _read(KEYS.TRANSACTIONS); }

        function getCustomerTransactions(customerId) {
            return getTransactions()
                .filter(t => t.customer_id === customerId)
                .sort((a, b) => new Date(b.date) - new Date(a.date));
        }

        function addTransaction({
            customer_id, type, currency, amount,
            depositor_name = '', notes = '', date = null
        }) {
            const transactions = getTransactions();
            const newTx = {
                id: _newId(),
                customer_id,
                type,
                currency,
                amount: Number(amount),
                depositor_name: depositor_name.trim(),
                notes: notes.trim(),
                date: date || new Date().toISOString(),
                created_at: new Date().toISOString()
            };
            transactions.push(newTx);
            _write(KEYS.TRANSACTIONS, transactions);
            return newTx;
        }

        function deleteTransaction(id) {
            _write(KEYS.TRANSACTIONS, getTransactions().filter(t => t.id !== id));
            return true;
        }

        // ------- الأرصدة -------
        function getBalance(customerId, currency) {
            const txs = getCustomerTransactions(customerId);
            let balance = 0;
            for (const tx of txs) {
                if (tx.currency !== currency) continue;
                balance += (tx.type === 'deposit' ? tx.amount : -tx.amount);
            }
            return balance;
        }

        function getCustomerBalance(customerId) {
            return {
                SYP: getBalance(customerId, 'SYP'),
                USD: getBalance(customerId, 'USD')
            };
        }

        function getTotalBalances() {
            const customers = getCustomers();
            let SYP = 0, USD = 0;
            for (const c of customers) {
                SYP += getBalance(c.id, 'SYP');
                USD += getBalance(c.id, 'USD');
            }
            return { SYP, USD, customersCount: customers.length };
        }

        return {
            getCustomers, getCustomer, addCustomer, updateCustomer, deleteCustomer,
            getTransactions, getCustomerTransactions, addTransaction, deleteTransaction,
            getBalance, getCustomerBalance, getTotalBalances
        };
    })();


    /* ===================================================
       2) أدوات مساعدة (Helpers)
       =================================================== */

    // تنسيق الأرقام
    function formatNumber(num) {
        if (num === 0) return '0';
        return new Intl.NumberFormat('en-US', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        }).format(num);
    }

    // تنسيق التاريخ (عربي)
    function formatDate(iso) {
        const d = new Date(iso);
        if (isNaN(d)) return '';
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}/${month}/${year}`;
    }

    // تاريخ اليوم بصيغة YYYY-MM-DD لحقل date
    function todayISO() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    // تحويل تاريخ + وقت ISO إلى صيغة YYYY-MM-DD
    function isoToDateInput(iso) {
        const d = new Date(iso);
        if (isNaN(d)) return '';
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    // هروب HTML
    function esc(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // تنبيه
    let toastTimer = null;
    function toast(message, type = '') {
        const el = document.getElementById('toast');
        el.textContent = message;
        el.className = 'toast show ' + type;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            el.className = 'toast ' + type;
        }, 2500);
    }

    // فتح/إغلاق نافذة
    function openModal(id) {
        document.getElementById(id).classList.add('show');
    }
    function closeModal(id) {
        document.getElementById(id).classList.remove('show');
    }


    /* ===================================================
       3) الحالة العامة
       =================================================== */
    let currentCustomerId = null;
    let currentSearch = '';
    let filterFrom = '';
    let filterTo = '';


    /* ===================================================
       4) عرض شاشة العملاء
       =================================================== */
    function renderCustomers() {
        const all = DB.getCustomers();

        const filtered = currentSearch
            ? all.filter(c =>
                c.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
                (c.phone && c.phone.includes(currentSearch)))
            : all;

        filtered.sort((a, b) => a.name.localeCompare(b.name, 'ar'));

        const listEl = document.getElementById('customersList');
        const emptyEl = document.getElementById('emptyState');

        if (filtered.length === 0) {
            listEl.innerHTML = '';
            emptyEl.style.display = 'block';
            document.getElementById('emptyTitle').textContent =
                currentSearch ? 'لا نتائج مطابقة' : 'لا يوجد عملاء بعد';
            document.getElementById('emptyDesc').textContent =
                currentSearch ? 'جرّب البحث باسم آخر' : 'ابدأ بإضافة أول عميل لك';
            return;
        }

        emptyEl.style.display = 'none';

        listEl.innerHTML = filtered.map(c => {
            const bal = DB.getCustomerBalance(c.id);
            return `
                <div class="customer-card" data-id="${c.id}">
                    <div class="customer-header">
                        <div>
                            <div class="customer-name">${esc(c.name)}</div>
                            ${c.phone ? `<div class="customer-phone">📞 ${esc(c.phone)}</div>` : ''}
                        </div>
                    </div>
                    <div class="customer-balances">
                        <div class="balance-item">
                            <div class="balance-label">🍋 ليرة سورية</div>
                            <div class="balance-amount">${formatNumber(bal.SYP)}</div>
                        </div>
                        <div class="balance-item usd">
                            <div class="balance-label">💵 دولار</div>
                            <div class="balance-amount">${formatNumber(bal.USD)}</div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        // ربط النقر
        listEl.querySelectorAll('.customer-card').forEach(card => {
            card.addEventListener('click', () => openCustomer(card.dataset.id));
        });
    }

    function renderStats() {
        const t = DB.getTotalBalances();
        document.getElementById('statCustomers').textContent = t.customersCount;
        document.getElementById('statSYP').textContent = formatNumber(t.SYP);
        document.getElementById('statUSD').textContent = formatNumber(t.USD);
    }


    /* ===================================================
       5) التنقل بين الشاشات (SPA)
       =================================================== */
    function goHome() {
        currentCustomerId = null;
        location.hash = '';
        showView('viewList');
        renderCustomers();
        renderStats();
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openCustomer(id) {
        const c = DB.getCustomer(id);
        if (!c) {
            toast('العميل غير موجود', 'error');
            goHome();
            return;
        }
        currentCustomerId = id;
        location.hash = `customer=${id}`;
        renderCustomerView();
        showView('viewCustomer');
    }


    /* ===================================================
       6) عرض شاشة العميل
       =================================================== */
    function renderCustomerView() {
        const c = DB.getCustomer(currentCustomerId);
        if (!c) { goHome(); return; }

        // بيانات العميل
        document.getElementById('custName').textContent = c.name;
        const phoneEl = document.getElementById('custPhone');
        phoneEl.textContent = c.phone ? '📞 ' + c.phone : '';

        const notesEl = document.getElementById('custNotes');
        if (c.notes) {
            notesEl.textContent = '📝 ' + c.notes;
            notesEl.style.display = 'block';
        } else {
            notesEl.style.display = 'none';
        }

        // الأرصدة
        const bal = DB.getCustomerBalance(c.id);
        document.getElementById('custBalSYP').textContent = formatNumber(bal.SYP);
        document.getElementById('custBalUSD').textContent = formatNumber(bal.USD);

        // الحركات
        renderTransactions();
    }

    function renderTransactions() {
        const all = DB.getCustomerTransactions(currentCustomerId);

        // فلترة بالتاريخ
        let filtered = all;
        if (filterFrom) {
            const from = new Date(filterFrom + 'T00:00:00');
            filtered = filtered.filter(t => new Date(t.date) >= from);
        }
        if (filterTo) {
            const to = new Date(filterTo + 'T23:59:59');
            filtered = filtered.filter(t => new Date(t.date) <= to);
        }

        const listEl = document.getElementById('transactionsList');
        const emptyEl = document.getElementById('emptyTx');
        document.getElementById('txCount').textContent =
            filtered.length ? `(${filtered.length} حركة)` : '';

        if (filtered.length === 0) {
            listEl.innerHTML = '';
            emptyEl.style.display = 'block';
            return;
        }
        emptyEl.style.display = 'none';

        listEl.innerHTML = filtered.map(t => {
            const isDeposit = t.type === 'deposit';
            const currencyLabel = t.currency === 'SYP' ? '🍋' : '💵';
            const sign = isDeposit ? '+' : '−';
            const typeLabel = isDeposit ? 'إيداع' : 'سحب';
            const depositorPart = isDeposit && t.depositor_name
                ? `<span>👤 ${esc(t.depositor_name)}</span>`
                : '';

            return `
                <div class="transaction ${t.type}">
                    <div class="transaction-info">
                        <div class="transaction-type">${typeLabel}</div>
                        <div class="transaction-meta">
                            <span>📅 ${formatDate(t.date)}</span>
                            ${depositorPart}
                        </div>
                        ${t.notes ? `<div class="transaction-notes">${esc(t.notes)}</div>` : ''}
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <div class="transaction-amount">${sign} ${currencyLabel} ${formatNumber(t.amount)}</div>
                        <button class="transaction-delete no-print" data-id="${t.id}" title="حذف">🗑️</button>
                    </div>
                </div>
            `;
        }).join('');

        // ربط أزرار الحذف
        listEl.querySelectorAll('.transaction-delete').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.dataset.id;
                if (confirm('هل تريد حذف هذه الحركة؟')) {
                    DB.deleteTransaction(id);
                    toast('تم حذف الحركة', 'success');
                    renderCustomerView();
                    renderStats();
                }
            });
        });
    }


    /* ===================================================
       7) نافذة العميل (إضافة/تعديل)
       =================================================== */
    function openCustomerModal(customer = null) {
        const title = document.getElementById('modalCustomerTitle');
        const inputId = document.getElementById('inputCustomerId');
        const inputName = document.getElementById('inputName');
        const inputPhone = document.getElementById('inputPhone');
        const inputNotes = document.getElementById('inputNotes');

        if (customer) {
            title.textContent = 'تعديل بيانات العميل';
            inputId.value = customer.id;
            inputName.value = customer.name;
            inputPhone.value = customer.phone || '';
            inputNotes.value = customer.notes || '';
        } else {
            title.textContent = 'إضافة عميل جديد';
            inputId.value = '';
            inputName.value = '';
            inputPhone.value = '';
            inputNotes.value = '';
        }

        openModal('modalCustomer');
        setTimeout(() => inputName.focus(), 150);
    }

    function submitCustomer(e) {
        e.preventDefault();

        const id = document.getElementById('inputCustomerId').value;
        const name = document.getElementById('inputName').value.trim();
        const phone = document.getElementById('inputPhone').value.trim();
        const notes = document.getElementById('inputNotes').value.trim();

        if (!name) { toast('الاسم مطلوب', 'error'); return; }

        if (id) {
            DB.updateCustomer(id, { name, phone, notes });
            toast('تم تحديث بيانات العميل ✅', 'success');
        } else {
            DB.addCustomer({ name, phone, notes });
            toast('تم إضافة العميل بنجاح ✅', 'success');
        }

        closeModal('modalCustomer');
        renderCustomers();
        renderStats();
        if (currentCustomerId === id) renderCustomerView();
    }


    /* ===================================================
       8) نافذة الحركة (إيداع/سحب)
       =================================================== */
    function openTransactionModal(type, currency = 'SYP') {
        // type: 'deposit' أو 'withdraw'
        document.getElementById('inputTxType').value = type;
        document.getElementById('modalTxTitle').textContent =
            type === 'deposit' ? 'إضافة إيداع' : 'إضافة سحب';

        // إظهار/إخفاء حقل المودع
        document.getElementById('groupDepositor').style.display =
            type === 'deposit' ? 'block' : 'none';

        // إعادة تعيين الحقول
        document.getElementById('inputDepositor').value = '';
        document.getElementById('inputAmount').value = '';
        document.getElementById('inputTxNotes').value = '';
        document.getElementById('inputDate').value = todayISO();

        // تعيين العملة
        selectCurrency(currency);

        openModal('modalTransaction');
        setTimeout(() => {
            if (type === 'deposit') document.getElementById('inputDepositor').focus();
            else document.getElementById('inputAmount').focus();
        }, 150);
    }

    function selectCurrency(currency) {
        document.getElementById('inputCurrency').value = currency;
        document.querySelectorAll('.currency-option').forEach(opt => {
            opt.classList.remove('selected', 'usd');
            if (opt.dataset.currency === currency) {
                opt.classList.add('selected');
                if (currency === 'USD') opt.classList.add('usd');
            }
        });
    }

    function submitTransaction(e) {
        e.preventDefault();

        const type = document.getElementById('inputTxType').value;
        const currency = document.getElementById('inputCurrency').value;
        const amount = parseFloat(document.getElementById('inputAmount').value);
        const depositor = document.getElementById('inputDepositor').value.trim();
        const dateStr = document.getElementById('inputDate').value;
        const notes = document.getElementById('inputTxNotes').value.trim();

        // التحقق
        if (type === 'deposit' && !depositor) {
            toast('اسم المودع مطلوب', 'error');
            return;
        }
        if (!amount || amount <= 0) {
            toast('المبلغ غير صحيح', 'error');
            return;
        }

        // تحذير عند السحب أكبر من الرصيد
        if (type === 'withdraw') {
            const bal = DB.getBalance(currentCustomerId, currency);
            if (amount > bal) {
                const currLabel = currency === 'SYP' ? 'ليرة' : 'دولار';
                if (!confirm(`المبلغ (${formatNumber(amount)} ${currLabel}) أكبر من الرصيد (${formatNumber(bal)} ${currLabel}).\n\nهل تريد المتابعة؟`)) {
                    return;
                }
            }
        }

        // تاريخ: نأخذ من الحقل + الوقت الحالي
        const now = new Date();
        const dateISO = dateStr
            ? new Date(dateStr + 'T' + String(now.getHours()).padStart(2,'0') + ':' +
                       String(now.getMinutes()).padStart(2,'0') + ':' +
                       String(now.getSeconds()).padStart(2,'0')).toISOString()
            : new Date().toISOString();

        DB.addTransaction({
            customer_id: currentCustomerId,
            type,
            currency,
            amount,
            depositor_name: depositor,
            notes,
            date: dateISO
        });

        toast(type === 'deposit' ? 'تم تسجيل الإيداع ✅' : 'تم تسجيل السحب ✅', 'success');
        closeModal('modalTransaction');
        renderCustomerView();
        renderStats();
    }


    /* ===================================================
       9) طباعة PDF
       =================================================== */
    function printCustomer() {
        const c = DB.getCustomer(currentCustomerId);
        if (!c) return;

        const bal = DB.getCustomerBalance(c.id);
        const txs = DB.getCustomerTransactions(c.id);

        // ننشئ عنصر مؤقت للطباعة
        const printDiv = document.createElement('div');
        printDiv.style.cssText = `
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            padding: 30px;
            background: #fff;
            color: #1f2937;
            width: 800px;
        `;

        let txRows = txs.map(t => {
            const typeLabel = t.type === 'deposit' ? 'إيداع' : 'سحب';
            const color = t.type === 'deposit' ? '#16a34a' : '#dc2626';
            const sign = t.type === 'deposit' ? '+' : '−';
            const currency = t.currency === 'SYP' ? 'ل.س' : '$';
            const depositor = t.depositor_name ? t.depositor_name : '—';
            const notes = t.notes || '—';
            return `
                <tr style="border-bottom:1px solid #e5e7eb;">
                    <td style="padding:8px; text-align:center;">${formatDate(t.date)}</td>
                    <td style="padding:8px; text-align:center; color:${color}; font-weight:700;">${typeLabel}</td>
                    <td style="padding:8px; text-align:center;">${t.currency === 'SYP' ? '🍋 ليرة' : '💵 دولار'}</td>
                    <td style="padding:8px; text-align:center; font-weight:700; direction:ltr; color:${color};">
                        ${sign} ${formatNumber(t.amount)} ${currency}
                    </td>
                    <td style="padding:8px; text-align:center; font-size:13px;">${depositor}</td>
                    <td style="padding:8px; text-align:center; font-size:13px; color:#6b7280;">${notes}</td>
                </tr>
            `;
        }).join('');

        if (!txRows) {
            txRows = `<tr><td colspan="6" style="padding:20px; text-align:center; color:#6b7280;">لا توجد حركات</td></tr>`;
        }

        printDiv.innerHTML = `
            <div style="text-align:center; margin-bottom:20px; border-bottom:3px solid #f37021; padding-bottom:14px;">
                <h1 style="color:#f37021; margin:0; font-size:26px;">🏦 الأمانات</h1>
                <p style="color:#6b7280; margin:6px 0 0; font-size:13px;">نظام إدارة الودائع</p>
            </div>

            <div style="background:#fff3ec; padding:14px; border-radius:8px; margin-bottom:14px;">
                <h2 style="margin:0 0 8px; font-size:20px; color:#1f2937;">${esc(c.name)}</h2>
                ${c.phone ? `<p style="margin:4px 0; color:#6b7280; font-size:14px; direction:ltr;">📞 ${esc(c.phone)}</p>` : ''}
                ${c.notes ? `<p style="margin:4px 0; color:#6b7280; font-size:13px;">📝 ${esc(c.notes)}</p>` : ''}
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px;">
                <div style="background:#fff3ec; padding:14px; border-radius:8px; text-align:center;">
                    <div style="color:#6b7280; font-size:13px; margin-bottom:4px;">🍋 رصيد الليرة السورية</div>
                    <div style="color:#f37021; font-size:22px; font-weight:900; direction:ltr;">${formatNumber(bal.SYP)}</div>
                </div>
                <div style="background:#ecfdf5; padding:14px; border-radius:8px; text-align:center;">
                    <div style="color:#6b7280; font-size:13px; margin-bottom:4px;">💵 رصيد الدولار الأمريكي</div>
                    <div style="color:#22c55e; font-size:22px; font-weight:900; direction:ltr;">${formatNumber(bal.USD)}</div>
                </div>
            </div>

            <h3 style="margin:0 0 10px; color:#1f2937; font-size:16px;">📋 سجل الحركات (${txs.length})</h3>
            <table style="width:100%; border-collapse:collapse; font-size:13px; border:1px solid #e5e7eb;">
                <thead>
                    <tr style="background:#f5f5f5;">
                        <th style="padding:8px; border-bottom:2px solid #f37021;">التاريخ</th>
                        <th style="padding:8px; border-bottom:2px solid #f37021;">النوع</th>
                        <th style="padding:8px; border-bottom:2px solid #f37021;">العملة</th>
                        <th style="padding:8px; border-bottom:2px solid #f37021;">المبلغ</th>
                        <th style="padding:8px; border-bottom:2px solid #f37021;">المودع</th>
                        <th style="padding:8px; border-bottom:2px solid #f37021;">ملاحظات</th>
                    </tr>
                </thead>
                <tbody>${txRows}</tbody>
            </table>

            <div style="margin-top:20px; text-align:center; color:#6b7280; font-size:11px; border-top:1px solid #e5e7eb; padding-top:10px;">
                تم إنشاء هذا التقرير بتاريخ ${formatDate(new Date().toISOString())}
            </div>
        `;

        const opt = {
            margin: 10,
            filename: `امانات_${c.name}_${todayISO()}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(printDiv).save();
        toast('جاري تحضير الملف...', 'success');
    }


    /* ===================================================
       10) نسخ احتياطي / استيراد
       =================================================== */
    function backup() {
        const data = {
            version: 1,
            exported_at: new Date().toISOString(),
            customers: DB.getCustomers(),
            transactions: DB.getTransactions()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `amanat_backup_${todayISO()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        toast('تم تصدير النسخة الاحتياطية 💾', 'success');
    }

    function restore() {
        document.getElementById('importFile').click();
    }

    function handleImport(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if (!data.customers || !data.transactions) {
                    throw new Error('ملف غير صالح');
                }
                if (!confirm(`سيتم استبدال كل البيانات الحالية بـ:\n${data.customers.length} عميل، ${data.transactions.length} حركة.\n\nهل أنت متأكد؟`)) {
                    return;
                }
                localStorage.setItem('amanat_customers', JSON.stringify(data.customers));
                localStorage.setItem('amanat_transactions', JSON.stringify(data.transactions));
                toast('تم استيراد البيانات بنجاح ✅', 'success');
                goHome();
            } catch (err) {
                toast('فشل استيراد الملف: ' + err.message, 'error');
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    }


    /* ===================================================
       11) ربط الأحداث
       =================================================== */
    function bindEvents() {

        // البحث
        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearch = e.target.value.trim();
            renderCustomers();
        });

        // إضافة عميل
        document.getElementById('btnAddCustomer').addEventListener('click', () => {
            openCustomerModal();
        });

        // حفظ عميل
        document.getElementById('formCustomer').addEventListener('submit', submitCustomer);

        // حفظ حركة
        document.getElementById('formTransaction').addEventListener('submit', submitTransaction);

        // أزرار إغلاق النوافذ (data-close)
        document.querySelectorAll('[data-close]').forEach(btn => {
            btn.addEventListener('click', () => closeModal(btn.dataset.close));
        });

        // النقر خارج النافذة يغلقها
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.classList.remove('show');
            });
        });

        // Escape يغلق كل النوافذ
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
            }
        });

        // أزرار العميل
        document.getElementById('btnEditCustomer').addEventListener('click', () => {
            const c = DB.getCustomer(currentCustomerId);
            if (c) openCustomerModal(c);
        });

        document.getElementById('btnDeleteCustomer').addEventListener('click', () => {
            const c = DB.getCustomer(currentCustomerId);
            if (!c) return;
            if (confirm(`هل تريد حذف العميل "${c.name}" وكل حركاته؟\nلا يمكن التراجع.`)) {
                DB.deleteCustomer(currentCustomerId);
                toast('تم حذف العميل', 'success');
                goHome();
            }
        });

        document.getElementById('btnDeposit').addEventListener('click', () => {
            openTransactionModal('deposit', 'SYP');
        });

        document.getElementById('btnWithdraw').addEventListener('click', () => {
            openTransactionModal('withdraw', 'SYP');
        });

        document.getElementById('btnPrint').addEventListener('click', printCustomer);

        // اختيار العملة
        document.querySelectorAll('.currency-option').forEach(opt => {
            opt.addEventListener('click', () => selectCurrency(opt.dataset.currency));
        });

        // فلترة التاريخ
        document.getElementById('filterFrom').addEventListener('change', (e) => {
            filterFrom = e.target.value;
            renderTransactions();
        });
        document.getElementById('filterTo').addEventListener('change', (e) => {
            filterTo = e.target.value;
            renderTransactions();
        });
        document.getElementById('btnClearFilter').addEventListener('click', () => {
            filterFrom = '';
            filterTo = '';
            document.getElementById('filterFrom').value = '';
            document.getElementById('filterTo').value = '';
            renderTransactions();
        });

        // نسخ احتياطي
        document.getElementById('btnBackup').addEventListener('click', backup);
        document.getElementById('btnRestore').addEventListener('click', restore);
        document.getElementById('importFile').addEventListener('change', handleImport);
    }


    /* ===================================================
       12) التشغيل الأولي
       =================================================== */
    function init() {
        bindEvents();
        renderCustomers();
        renderStats();

        // إذا كان الرابط فيه #customer=xxx
        const hash = location.hash;
        const match = hash.match(/customer=([^&]+)/);
        if (match && DB.getCustomer(match[1])) {
            openCustomer(match[1]);
        }

        // استمع لتغيّر الـ hash (زر الرجوع في المتصفح)
        window.addEventListener('hashchange', () => {
            const m = location.hash.match(/customer=([^&]+)/);
            if (m && DB.getCustomer(m[1])) {
                openCustomer(m[1]);
            } else {
                showView('viewList');
                renderCustomers();
                renderStats();
            }
        });

        console.log('✅ تم تحميل تطبيق الأمانات بنجاح');
    }

    document.addEventListener('DOMContentLoaded', init);

    // API عام (يُستخدم في onclick)
    return {
        goHome,
        openCustomer
    };

})();
</script>
